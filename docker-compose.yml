services:
  mysql:
    image: mysql:8.0
    container_name: autotrack-mysql
    environment:
      MYSQL_ROOT_PASSWORD: localroot123
      MYSQL_DATABASE: autotrack
      MYSQL_USER: autotrack
      MYSQL_PASSWORD: autotrack123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/AutoTrack.sql:/docker-entrypoint-initdb.d/01-autotrack.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "autotrack", "-pautotrack123"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
